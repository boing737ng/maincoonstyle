services:
  db:
    image: postgres:16-alpine
    container_name: meinkun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: meinkun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    networks:
      internal:
      edge:
        aliases:
          - meinkun-minio

  minio-init:
    image: minio/mc:latest
    container_name: meinkun-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        mc mb --ignore-existing local/"$$S3_BUCKET"
        mc anonymous set download local/"$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    networks:
      - internal

  app:
    container_name: meinkun-app
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL}
        NEXT_PUBLIC_S3_BUCKET: ${NEXT_PUBLIC_S3_BUCKET}
        NEXT_PUBLIC_PHONE_DISPLAY: ${NEXT_PUBLIC_PHONE_DISPLAY}
        NEXT_PUBLIC_PHONE_TEL: ${NEXT_PUBLIC_PHONE_TEL}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: minio
      S3_PORT: "9000"
      S3_USE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "3000"
    networks:
      - internal
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  ops:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL}
        NEXT_PUBLIC_S3_BUCKET: ${NEXT_PUBLIC_S3_BUCKET}
        NEXT_PUBLIC_PHONE_DISPLAY: ${NEXT_PUBLIC_PHONE_DISPLAY}
        NEXT_PUBLIC_PHONE_TEL: ${NEXT_PUBLIC_PHONE_TEL}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL}
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: minio
      S3_PORT: "9000"
      S3_USE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    internal: true
  edge:
    external: true
    name: nginx_default

volumes:
  db_data:
  minio_data:
