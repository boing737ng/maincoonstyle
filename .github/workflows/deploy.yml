name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build application image
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          S3_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_S3_PUBLIC_URL }}
          S3_BUCKET: ${{ secrets.NEXT_PUBLIC_S3_BUCKET }}
          PHONE_DISPLAY: ${{ secrets.NEXT_PUBLIC_PHONE_DISPLAY }}
          PHONE_TEL: ${{ secrets.NEXT_PUBLIC_PHONE_TEL }}
          EMAIL: ${{ secrets.NEXT_PUBLIC_EMAIL }}
        run: |
          docker build --pull --target runner \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            --build-arg NEXT_PUBLIC_S3_PUBLIC_URL="$S3_PUBLIC_URL" \
            --build-arg NEXT_PUBLIC_S3_BUCKET="$S3_BUCKET" \
            --build-arg NEXT_PUBLIC_PHONE_DISPLAY="$PHONE_DISPLAY" \
            --build-arg NEXT_PUBLIC_PHONE_TEL="$PHONE_TEL" \
            --build-arg NEXT_PUBLIC_EMAIL="$EMAIL" \
            -t "meinkun-release:$GITHUB_SHA" .

      - name: Archive release image
        run: |
          docker save "meinkun-release:$GITHUB_SHA" | gzip -1 > /tmp/meinkun-image.tar.gz

      - name: Upload release image artifact
        uses: actions/upload-artifact@v4
        with:
          name: meinkun-image-${{ github.sha }}
          path: /tmp/meinkun-image.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull images on server
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$ARTIFACT_TOKEN" "$GITHUB_RUN_ID" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 -p "$PORT" "$USER@$HOST" "pull $GITHUB_SHA"

      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" "$USER@$HOST" \
            "deploy $GITHUB_SHA"
