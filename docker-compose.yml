services:
  db:
    image: postgres:16-alpine
    container_name: meinkun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meinkun
      POSTGRES_PASSWORD: meinkun
      POSTGRES_DB: meinkun
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "54321:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meinkun"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: meinkun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meinkun
      MINIO_ROOT_PASSWORD: meinkun-secret
    ports:
      - "9000:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: meinkun-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 meinkun meinkun-secret &&
      mc mb --ignore-existing local/meinkun-photos &&
      mc anonymous set download local/meinkun-photos &&
      exit 0;
      "

volumes:
  db_data:
  minio_data: