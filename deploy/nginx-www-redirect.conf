# Keep both names on the certificate; only the apex domain serves content.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.__MEINKUN_HOSTNAME__;

    ssl_certificate     /etc/letsencrypt/live/__MEINKUN_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MEINKUN_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://__MEINKUN_HOSTNAME__$request_uri;
}
